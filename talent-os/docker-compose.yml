# Talent OS — Docker Compose (REFERENCE / NOT DEPLOYED)
#
# This is NOT the file running in production -- that's /docker-compose.yml
# at the repo root (rsynced to the VPS by .github/workflows/deploy.yml),
# which only runs postgres+backend. This full-stack version (postgres+
# backend+nginx) was kept as a reference for standing up the AI matching /
# Apollo auto-sourcing background jobs as Celery tasks -- that plan was
# dropped (WS-C.3b, 2026-09-03): talent-os/backend/tasks/ (the Celery
# worker/beat code) was unused dead code -- nothing imported it, and it
# referenced a `settings.celery_result_backend` that did not even exist in
# core/config.py -- so it and the redis/celery-worker/celery-beat services
# that only existed to run it were removed rather than fixed. The
# equivalent work (services/scheduler.py) already runs as plain asyncio
# background jobs inside the FastAPI process, no broker needed. If a real
# task queue is ever needed again, start from scratch rather than reviving
# this.
# Memory limits ensure stability on 32GB VPS.
# ALL AI/LLM calls go through OpenRouter. NO models hosted in any container.
#
# WS-E.6 (2026-09-03): postgres's POSTGRES_PASSWORD used to come from
# ${POSTGRES_PASSWORD} (interpolated from this directory's .env at
# compose-parse time). It now comes from ./postgres.env via env_file
# instead (see talent-os/postgres.env.example) -- `required: false` so this
# still-undeployed reference file keeps parsing even before that file
# exists. backend/celery-worker/celery-beat below are untouched: they keep
# reading POSTGRES_PASSWORD the same way as before, so their env contract
# doesn't change (CLAUDE.md: change all three or none).
#
# Also added: JSON-file log rotation (max 5 x 20 MB per container) on
# postgres and backend, matching the root docker-compose.yml.
version: "3.8"

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: talentos-postgres
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2"
    environment:
      POSTGRES_DB: recruitment_db
      POSTGRES_USER: talentos_admin
    env_file:
      - path: ./postgres.env
        required: false
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentos_admin -d recruitment_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile
    container_name: talentos-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: recruitment_db
      POSTGRES_USER: talentos_write
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      API_KEY: ${API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      APOLLO_API_KEY: ${APOLLO_API_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      BACKEND_HOST: "127.0.0.1"
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: "http://localhost:3000"
      LOG_LEVEL: INFO
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  # ── Nginx Reverse Proxy ────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: talentos-nginx
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro  # TLS certs (set up manually)
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend

volumes:
  postgres_data:
