<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block subject %}GSP Recruitment{% endblock %}</title>
</head>
<body style="margin:0; padding:0; background:#F4F4F4; font-family:Arial, Helvetica, sans-serif; color:#1B1B1B;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F4F4F4; padding:24px 0;">
  <tr>
    <td align="center">
      <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="background:#FFFFFF; max-width:560px; width:100%;">
        <tr>
          <td style="background:#1B2A4A; padding:20px 28px; border-bottom:3px solid #C9A227;">
            <span style="color:#FFFFFF; font-size:18px; font-weight:bold; letter-spacing:0.5px;">GSP Recruitment</span>
          </td>
        </tr>
        <tr>
          <td style="padding:28px; font-size:14px; line-height:1.6; color:#1B1B1B;">
            {% block content %}{% endblock %}
          </td>
        </tr>
        <tr>
          <td style="padding:20px 28px; border-top:1px solid #E5E5E5; font-size:12px; color:#6B6B6B; line-height:1.6;">
            GSP Recruitment — Brainport/Eindhoven<br>
            <a href="mailto:info@gsprecruitment.nl" style="color:#1B2A4A;">info@gsprecruitment.nl</a> · <a href="https://gsprecruitment.nl" style="color:#1B2A4A;">gsprecruitment.nl</a><br>
            Dit is een geautomatiseerd bericht naar aanleiding van een actie op ons platform.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
