version: 2

updates:
  # Backend Python deps (talent-os/backend/requirements.txt). Dependabot
  # bumps version ranges in requirements.txt directly -- requirements.lock
  # (talent-os/backend/requirements.lock) is regenerated by hand afterwards
  # per docs/BACKEND-DEPS.md, not by Dependabot.
  - package-ecosystem: "pip"
    directory: "/talent-os/backend"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Mobile app (Expo/React Native, app/package.json).
  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used across .github/workflows/*.yml (ci.yml, deploy.yml,
  # uptime.yml, etc.).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
