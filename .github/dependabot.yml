version: 2

updates:
  # Backend Python deps (talent-os/backend/requirements.txt). Dependabot
  # bumps version ranges in requirements.txt directly -- requirements.lock
  # (talent-os/backend/requirements.lock) is regenerated by hand afterwards
  # per docs/BACKEND-DEPS.md, not by Dependabot.
  - package-ecosystem: "pip"
    directory: "/talent-os/backend"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Mobile app (Expo/React Native, app/package.json).
  # Packages whose version is set by the Expo SDK (expo@<sdk>'s
  # bundledNativeModules.json) are ignored here: they move together in one
  # deliberate SDK-upgrade PR via `npx expo install --fix`, never one at a
  # time. Bumping them alone (expo-router 58 on SDK 57, react-native 0.87 on
  # a 0.86 SDK) passes tsc and jest but breaks the native build.
  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "jest-expo"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-test-renderer"
      - dependency-name: "@types/react"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used across .github/workflows/*.yml (ci.yml, deploy.yml,
  # uptime.yml, etc.).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
