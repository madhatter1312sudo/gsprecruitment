name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    # WS-C.14: a real Postgres for tests/integration/ -- routers/tests that
    # exercise auth boundaries, GDPR erasure, jsonb round-trips etc. against
    # actual asyncpg/SQL, not a stubbed core.database. The unit suite (the
    # rest of talent-os/backend/tests/ and the two top-level test_*.py) never
    # touches this service and stays green with or without it -- see
    # backend/conftest.py, which skips anything marked `integration` when
    # POSTGRES_HOST isn't set.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mig
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: gsp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JWT_SECRET: ci-test-secret-not-used-in-production-32chars
      API_KEY: ci-test-key
      WEBHOOK_SECRET: ci-test-webhook-secret
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: gsp_ci
      POSTGRES_USER: mig
      POSTGRES_PASSWORD: ci-test-password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: talent-os/backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r talent-os/backend/requirements.txt

      - name: Compile / import sanity check
        run: python -m compileall talent-os/backend

      # scripts/check_api_contract.py is pure static analysis (regex over the
      # backend router files and the website's frontend JS/HTML) -- it does
      # not hit the live API and needs no secrets, so it's safe to run in CI.
      - name: API contract check (frontend calls vs backend routes)
        run: python3 scripts/check_api_contract.py

      # Regenerates openapi.snapshot.json from the live FastAPI app
      # (app.openapi() -- no server/DB needed) and fails if it differs from
      # the committed one, so a route/schema change without an updated
      # snapshot is caught here instead of silently drifting.
      - name: OpenAPI snapshot check
        run: python3 scripts/generate_openapi_snapshot.py --check

      # Applies migrations/0*.py in order against the postgres service above
      # (each one is its own idempotent, tracked-in-schema_migrations
      # script -- see migrations/_runner.py) so tests/integration/ has a
      # real, current schema to run against.
      - name: Run DB migrations
        working-directory: talent-os/backend/migrations
        run: |
          for f in 0*.py; do
            echo "== $f =="
            python3 "$f"
          done

      # POSTGRES_HOST is set (job env, above) so this run covers BOTH the
      # existing DB-free unit suite and tests/integration/ (marker
      # `integration`, auto-skipped otherwise -- see backend/conftest.py).
      - name: Run backend tests
        run: python3 -m pytest -q talent-os/backend

  mobile:
    name: Mobile (Expo/TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test -- --ci
