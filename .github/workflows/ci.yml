name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    # WS-C.14: a real Postgres for tests/integration/ -- routers/tests that
    # exercise auth boundaries, GDPR erasure, jsonb round-trips etc. against
    # actual asyncpg/SQL, not a stubbed core.database. The unit suite (the
    # rest of talent-os/backend/tests/ and the two top-level test_*.py) never
    # touches this service and stays green with or without it -- see
    # backend/conftest.py, which skips anything marked `integration` when
    # POSTGRES_HOST isn't set.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mig
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: gsp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JWT_SECRET: ci-test-secret-not-used-in-production-32chars
      API_KEY: ci-test-key
      WEBHOOK_SECRET: ci-test-webhook-secret
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: gsp_ci
      POSTGRES_USER: mig
      POSTGRES_PASSWORD: ci-test-password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # WS-E.9: pinned identically to deploy.yml and the Dockerfile
          # (python:3.12-slim) so CI tests the same interpreter version
          # that actually runs in production.
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: talent-os/backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r talent-os/backend/requirements.txt

      - name: Compile / import sanity check
        run: python -m compileall talent-os/backend

      # scripts/check_api_contract.py is pure static analysis (regex over the
      # backend router files and the website's frontend JS/HTML) -- it does
      # not hit the live API and needs no secrets, so it's safe to run in CI.
      - name: API contract check (frontend calls vs backend routes)
        run: python3 scripts/check_api_contract.py

      # Regenerates openapi.snapshot.json from the live FastAPI app
      # (app.openapi() -- no server/DB needed) and fails if it differs from
      # the committed one, so a route/schema change without an updated
      # snapshot is caught here instead of silently drifting.
      - name: OpenAPI snapshot check
        run: python3 scripts/generate_openapi_snapshot.py --check

      # Applies migrations/0*.py in order against the postgres service above
      # (each one is its own idempotent, tracked-in-schema_migrations
      # script -- see migrations/_runner.py) so tests/integration/ has a
      # real, current schema to run against.
      - name: Run DB migrations
        working-directory: talent-os/backend/migrations
        run: |
          for f in 0*.py; do
            echo "== $f =="
            python3 "$f"
          done

      # POSTGRES_HOST is set (job env, above) so this run covers BOTH the
      # existing DB-free unit suite and tests/integration/ (marker
      # `integration`, auto-skipped otherwise -- see backend/conftest.py).
      - name: Run backend tests
        run: python3 -m pytest -q talent-os/backend

  mobile:
    name: Mobile (Expo/TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test -- --ci

  pip-audit:
    name: Backend dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Pinned identically to the backend job / deploy.yml / Dockerfile.
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: talent-os/backend/requirements.txt

      - name: Install pip-audit
        run: pip install -r talent-os/backend/requirements-dev.txt

      # Audits BOTH files, for two different questions:
      #   - requirements.txt (the human-edited version-range source): a
      #     vuln discovered *after* the lock was last generated, in a
      #     version this repo's ranges would still happily resolve to
      #     today, shows up here first.
      #   - requirements.lock (what the Dockerfile actually installs):
      #     catches a vuln in the exact pinned version currently shipping,
      #     even if a wider-but-still-in-range version would have avoided
      #     it -- this is the one that answers "is production affected
      #     right now".
      # Known/accepted findings go in talent-os/backend/.pip-audit-ignore
      # (documented there, empty by default) rather than being silently
      # ignored inline; the same ignore list applies to both runs.
      - name: pip-audit
        working-directory: talent-os/backend
        run: |
          ignore_args=()
          if [ -f .pip-audit-ignore ]; then
            while IFS= read -r id; do
              [ -z "$id" ] && continue
              case "$id" in \#*) continue ;; esac
              ignore_args+=(--ignore-vuln "$id")
            done < .pip-audit-ignore
          fi
          echo "== requirements.txt (version ranges) =="
          pip-audit -r requirements.txt "${ignore_args[@]}"
          echo "== requirements.lock (what ships) =="
          pip-audit -r requirements.lock "${ignore_args[@]}"

  lock-consistency:
    name: Lockfile matches requirements.txt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Pinned identically to the backend job / deploy.yml / Dockerfile.
          python-version: "3.12"

      # Fails when requirements.lock (the Dockerfile's install source) has
      # drifted from what requirements.txt (the human-edited source) now
      # asks for -- e.g. someone widened/bumped a range in requirements.txt
      # without regenerating the lock (docs/BACKEND-DEPS.md), or a
      # transitive pin in the lock no longer satisfies it. A clean venv is
      # installed from the lock with --no-deps (exactly what the
      # Dockerfile does), `pip check` confirms nothing in that closed set
      # is internally broken, then a --no-deps --dry-run install of
      # requirements.txt against that same venv must report every direct
      # dependency as "already satisfied" -- any "Would install" line
      # means the lock no longer covers what requirements.txt declares.
      - name: Lock installs cleanly and satisfies requirements.txt
        working-directory: talent-os/backend
        run: |
          set -e
          python3 -m venv /tmp/lock-check-venv
          /tmp/lock-check-venv/bin/pip install --quiet --upgrade pip
          /tmp/lock-check-venv/bin/pip install --no-deps -r requirements.lock
          /tmp/lock-check-venv/bin/pip check
          dry_run_output=$(/tmp/lock-check-venv/bin/pip install --dry-run --no-deps -r requirements.txt 2>&1)
          echo "$dry_run_output"
          if echo "$dry_run_output" | grep -q "Would install"; then
            echo "::error::requirements.lock no longer satisfies requirements.txt -- regenerate the lock (see docs/BACKEND-DEPS.md)"
            exit 1
          fi
          echo "OK: requirements.lock satisfies requirements.txt"

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # gitleaks/gitleaks-action needs no license for public and personal
      # (non-org) repositories -- only GitHub organizations need a
      # GITLEAKS_LICENSE secret. This repo is a personal account repo, so
      # none is configured here; add GITLEAKS_LICENSE as an env var below
      # if it's ever transferred into an org.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: "true"
          # Explicit path, not relying on gitleaks-action's auto-detected
          # `gitleaks.toml` name -- this repo's file is the dotfile
          # .gitleaks.toml (see that file for the allowlist it adds).
          GITLEAKS_CONFIG: .gitleaks.toml

  web:
    name: Website (static checks + CSP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax-check every website JS file
        run: |
          status=0
          while IFS= read -r -d '' f; do
            node --check "$f" || status=1
          done < <(find website -name '*.js' -print0)
          exit $status

      - name: Only web asset extensions land under website/
        run: python3 scripts/check_website_extensions.py

      - name: DOM-XSS static sink check
        run: python3 scripts/xss_static_check.py

      - name: CSP coverage check
        run: python3 scripts/verify_csp_coverage.py

      # Pinned to 1.61.0 -- the newest pip `playwright` release at time of
      # writing; app/package.json pins @playwright/test to ^1.61.1 (npm has
      # a 1.61.1 patch the pip package does not yet mirror). Same Chromium
      # build either way; revisit this pin alongside app/'s next time both
      # are bumped.
      #
      # This step + the check below take ~1-2 minutes (browser download +
      # 21-page headless run) — noticeably slower than the rest of this
      # workflow but still well under CI's per-job budget, so it stays
      # inline here rather than as a separate scheduled workflow. If it
      # ever becomes a real bottleneck, split it into its own
      # workflow_dispatch/schedule-triggered job.
      - name: Install Playwright + Chromium
        run: |
          pip install playwright==1.61.0
          python3 -m playwright install --with-deps chromium

      - name: CSP / console-error browser check
        run: python3 scripts/csp_violation_check.py
