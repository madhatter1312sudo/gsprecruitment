name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: talent-os/backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r talent-os/backend/requirements.txt

      - name: Compile / import sanity check
        run: python -m compileall talent-os/backend

      # scripts/check_api_contract.py is pure static analysis (regex over the
      # backend router files and the website's frontend JS/HTML) -- it does
      # not hit the live API and needs no secrets, so it's safe to run in CI.
      - name: API contract check (frontend calls vs backend routes)
        run: python3 scripts/check_api_contract.py

      # Regenerates openapi.snapshot.json from the live FastAPI app
      # (app.openapi() -- no server/DB needed) and fails if it differs from
      # the committed one, so a route/schema change without an updated
      # snapshot is caught here instead of silently drifting.
      - name: OpenAPI snapshot check
        env:
          JWT_SECRET: ci-test-secret-not-used-in-production-32chars
          API_KEY: ci-test-key
          WEBHOOK_SECRET: ci-test-webhook-secret
          POSTGRES_PASSWORD: ci-test-password
        run: python3 scripts/generate_openapi_snapshot.py --check

      - name: Run backend tests
        env:
          JWT_SECRET: ci-test-secret-not-used-in-production-32chars
          API_KEY: ci-test-key
          WEBHOOK_SECRET: ci-test-webhook-secret
          POSTGRES_PASSWORD: ci-test-password
        run: python3 -m pytest -q talent-os/backend

  mobile:
    name: Mobile (Expo/TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test -- --ci
