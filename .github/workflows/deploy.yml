name: Deploy to Production

on:
  push:
    branches: [main]

# One deploy at a time: two merges in quick succession otherwise race on the
# VPS (docker compose "container name already in use" during recreate) and
# the loser rolls production back. Queued runs wait instead of cancelling so
# the newest main still gets deployed.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: API contract check (frontend calls vs backend routes)
        run: python3 scripts/check_api_contract.py

      - name: Install backend test dependencies
        run: pip install -r talent-os/backend/requirements.txt

      - name: Run backend tests
        env:
          JWT_SECRET: "ci-test-secret-not-used-in-production-32chars"
          API_KEY: "ci-test-api-key-not-used-in-production"
          WEBHOOK_SECRET: "ci-test-webhook-secret-not-used-in-production"
          POSTGRES_PASSWORD: "ci-test-postgres-password"
        run: |
          cd talent-os/backend
          python3 -m pytest -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # VPS_HOST/VPS_USER/VPS_PATH: repo/org "Actions variables" (Settings >
    # Secrets and variables > Actions > Variables), NOT secrets -- the host
    # and path aren't sensitive. The `|| '...'` literals are the current
    # production values and only take effect until the owner creates the
    # vars (see WS-E.6); once created, the vars win. Keep these three in
    # sync with the same fallbacks in backup-freshness.yml and
    # scripts/deploy.sh.
    env:
      VPS_HOST: ${{ vars.VPS_HOST || '188.245.254.248' }}
      VPS_USER: ${{ vars.VPS_USER || 'gsp' }}
      VPS_PATH: ${{ vars.VPS_PATH || '/home/gsp/projects/gsp-recruitment' }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Sync backend code to VPS
        run: |
          rsync -avz --exclude='.env' --exclude='__pycache__' --exclude='*.pyc' \
            talent-os/ \
            "${VPS_USER}@${VPS_HOST}:${VPS_PATH}/talent-os/"

      - name: Sync docker-compose.yml
        run: |
          rsync -avz docker-compose.yml \
            "${VPS_USER}@${VPS_HOST}:${VPS_PATH}/docker-compose.yml"

      - name: Sync website (frontend) to Cloudflare via git push
        run: |
          # The frontend is on Cloudflare Pages, which auto-deploys from this repo
          echo "Frontend is auto-deployed by Cloudflare Pages from this repository"

      - name: Tag current image for rollback before replacing it
        run: |
          ssh "${VPS_USER}@${VPS_HOST}" "
            if docker image inspect gsp-recruitment-backend:latest >/dev/null 2>&1; then
              docker tag gsp-recruitment-backend:latest gsp-recruitment-backend:previous
            fi
          "

      # WS-E.6: postgres credentials now live in talent-os/postgres.env
      # (env_file, gitignored) instead of only talent-os/.env. This step is
      # idempotent and a no-op after the first run -- it never overwrites an
      # existing postgres.env, and never prints a secret value, only whether
      # it created the file. Without it, a VPS that predates this change
      # would fail `docker compose up` the moment postgres.env becomes a
      # required env_file in docker-compose.yml.
      - name: Ensure postgres.env exists (idempotent, generated from .env on first run only)
        run: |
          ssh "${VPS_USER}@${VPS_HOST}" "
            cd ${VPS_PATH}/talent-os && \
            if [ ! -f postgres.env ]; then
              echo 'postgres.env missing -- generating it from .env (first run only)' && \
              grep -E '^(POSTGRES_DB|POSTGRES_USER|POSTGRES_PASSWORD)=' .env > postgres.env && \
              chmod 600 postgres.env
            else
              echo 'postgres.env already present -- leaving it as-is'
            fi
          "

      # Deze stap BOUWT alleen, hij vervangt de draaiende backend niet.
      # Tot deze reparatieronde stond hier `docker compose up -d --build
      # backend`, dus draaide de nieuwe code al vóór de migratiestap
      # hieronder. Elke deploy met een schemawijziging had daarmee een
      # venster van tientallen seconden waarin de nieuwe code kolommen
      # aansprak die nog niet bestonden -- concreet: core/retention.py's
      # LOGIN_STAMP_SQL schrijft `dormant_warning_attempts` en
      # `dormant_warning_attempt_at` (migratie 042) in alle vier de
      # inlogpaden zonder try/except, dus élke login, ook die van de
      # beheerder, gaf in dat venster een 500 met een
      # UndefinedColumnError. Dat is structureel en niet eigen aan dat
      # ene spoor: bouwen, dan migreren, dan omschakelen is de enige
      # volgorde waarin de draaiende code nooit voorloopt op het schema.
      #
      # `build` tagt dezelfde image (`<project>-backend:latest`) die `up
      # --build` tagde, dus de migratiestap hieronder en de
      # up-stap daarna draaien allebei op precies deze build, en de
      # rollback-tak onderaan (die `:previous` terugtagt) blijft kloppen.
      #
      # `up -d --wait postgres` staat hier omdat de migratiestap
      # hieronder `--no-deps` gebruikt en dus zelf geen postgres start:
      # die afhankelijkheid werd tot nu toe stilzwijgend vervuld door de
      # `up -d --build backend` die hier stond (depends_on:
      # service_healthy). Idempotent op een draaiende VPS, en `--wait`
      # houdt dezelfde healthy-garantie aan als dat depends_on.
      - name: Build the new backend image and make sure postgres is up
        run: |
          ssh "${VPS_USER}@${VPS_HOST}" "
            cd ${VPS_PATH} && \
            docker compose build backend && \
            docker compose up -d --wait postgres
          "

      - name: Run database migrations
        # WS-C.1: every migrations/0*.py (000_baseline.py first, then the
        # rest in filename order) applied against the freshly built image
        # from `docker compose run --rm`, NOT `docker compose exec` on the
        # already-restarted `backend` service -- `exec` requires that
        # service container to be up and healthy, so a crash-looping
        # backend (e.g. this exact build is broken) would silently skip
        # migrations and only fail later, opaquely, at the health check.
        # `run --rm --no-deps` starts a fresh one-off container from the
        # same image, independent of the restarted service's state, so a
        # bad image fails loudly right here instead. --no-deps: postgres
        # is already up from the previous step (die stap start hem nu
        # expliciet met `up -d --wait postgres`, want hij start de
        # backend-service niet meer). Each migration tracks
        # itself in schema_migrations and is a no-op if already applied
        # (migrations/_runner.py), so running the full set on every deploy
        # is safe.
        #
        # Wat deze stap DOET is onveranderd. Alleen zijn plaats in de
        # volgorde is veranderd: hij draait nu vóór de nieuwe code live
        # gaat, niet erna. Dezelfde image, dezelfde env_files en dus
        # dezelfde database-URL als de service -- `run` neemt de
        # servicedefinitie over -- dus er is geen pad waarlangs deze
        # container een andere database zou raken dan de backend zelf.
        run: |
          ssh "${VPS_USER}@${VPS_HOST}" "
            cd ${VPS_PATH} && \
            docker compose run --rm -T --no-deps backend sh -c 'for f in migrations/0*.py; do echo Running \$f; python \$f || exit 1; done'
          "

      # Pas hier gaat de nieuwe code live, op een schema dat er al bij
      # past. Mislukt de migratiestap hierboven, dan draait de OUDE
      # backend nog en is er niets omgeschakeld.
      - name: Start the new backend image
        run: |
          ssh "${VPS_USER}@${VPS_HOST}" "
            cd ${VPS_PATH} && \
            docker compose up -d backend && \
            sleep 5
          "

      - name: Health check
        run: |
          ssh "${VPS_USER}@${VPS_HOST}" "
            cd ${VPS_PATH} && \
            echo '=== Health Check ===' && \
            curl -sf http://127.0.0.1:8000/health | python3 -m json.tool
          "

      - name: Tag this build with its git SHA and prune old history
        if: success()
        continue-on-error: true  # nice-to-have; must never fail an otherwise-successful deploy
        run: |
          ssh "${VPS_USER}@${VPS_HOST}" "
            docker tag gsp-recruitment-backend:latest gsp-recruitment-backend:${{ github.sha }} && \
            docker images gsp-recruitment-backend --format '{{.Tag}}' \
              | grep -vE '^(latest|previous)\$' \
              | tail -n +6 \
              | xargs -r -I{} docker rmi gsp-recruitment-backend:{}
          "

      - name: Roll back to previous image on health check failure
        if: failure()
        run: |
          ssh "${VPS_USER}@${VPS_HOST}" "
            if docker image inspect gsp-recruitment-backend:previous >/dev/null 2>&1; then
              docker tag gsp-recruitment-backend:previous gsp-recruitment-backend:latest && \
              cd ${VPS_PATH} && \
              docker compose up -d backend && \
              echo 'Rolled back to previous image.'
            else
              echo 'No previous image tag found -- cannot auto-rollback. Manual intervention needed.'
            fi
          "

      - name: Health check success notification
        if: success()
        run: echo "✅ Deployment successful! Backend healthy, frontend auto-deployed by Cloudflare."

      - name: Health check failure notification
        if: failure()
        run: echo "❌ Deployment failed! Rolled back to the previous image if one was available -- check the VPS."