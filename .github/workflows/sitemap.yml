name: Regenerate sitemap

# WS-A.7: website/sitemap.xml is generated, not hand-maintained. This is a
# standalone workflow (not a step in deploy.yml) so a sitemap-generation or
# push failure can never block a backend deploy -- it runs on its own
# schedule, on demand, and on pushes that touch the sitemap's own inputs.
#
# paths-ignore on website/sitemap.xml means the bot's own commit (which
# only touches that file, message ends [skip ci]) can never retrigger this
# workflow -- belt and suspenders alongside the [skip ci] marker itself.
on:
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC daily
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "website/**"
      - "!website/sitemap.xml"
      - "scripts/generate_sitemap.py"

concurrency:
  group: sitemap
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history -- generate_sitemap.py reads `git log` per file for lastmod

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # continue-on-error: a jobs/blog API hiccup, or a race with another
      # push to main, must never fail this workflow -- there's always a
      # next scheduled run, or the next push that touches website/**.
      - name: Generate and commit website/sitemap.xml
        continue-on-error: true
        run: |
          python3 scripts/generate_sitemap.py
          if ! git diff --quiet -- website/sitemap.xml; then
            git config user.name "gsp-ops-bot"
            git config user.email "ops@gsprecruitment.nl"
            git pull --rebase origin main
            git add website/sitemap.xml
            git commit -m "chore: regenerate sitemap.xml [skip ci]"
            git push origin HEAD:main
          else
            echo "sitemap.xml unchanged -- nothing to commit"
          fi
