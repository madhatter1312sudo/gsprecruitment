# GSP Recruitment — Docker Compose
# Caddy-compatible versie (alleen 127.0.0.1 binding, geen nginx)
#
# THIS IS THE FILE ACTUALLY DEPLOYED TO PRODUCTION (rsynced by
# .github/workflows/deploy.yml to the Hetzner VPS). It runs
# postgres + backend + redis + worker (ARQ background jobs -- see
# talent-os/backend/worker.py). The Celery-based tasks in
# talent-os/backend/tasks/ are dead code, not run by anything here.
# See talent-os/docker-compose.yml for the full-stack reference config
# (postgres+redis+backend+celery+nginx) if that Celery path ever gets
# revived -- it is NOT deployed.

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: gsp-postgres
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
    env_file:
      - ./talent-os/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./talent-os/scripts/init_db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentos_admin -d recruitment_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - gsp-net

  # ── FastAPI Backend ────────────────────────────────────────────────────
  backend:
    build:
      context: ./talent-os/backend
      dockerfile: ../Dockerfile
    container_name: gsp-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
    env_file:
      - ./talent-os/.env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - gsp-net

  # ── Redis (ARQ broker/result backend) ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: gsp-redis
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - gsp-net

  # ── ARQ worker (talent-os/backend/worker.py) ───────────────────────────
  worker:
    build:
      context: ./talent-os/backend
      dockerfile: ../Dockerfile
    container_name: gsp-worker
    command: ["python3", "-m", "arq", "worker.WorkerSettings"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    env_file:
      - ./talent-os/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # ARQ has no HTTP surface to probe. `arq --check` asks the running
      # worker to report its own health via a Redis key it maintains
      # (last job/queue activity) -- this is arq's own supported health
      # check, not a generic process-exists check.
      test: ["CMD", "python3", "-m", "arq", "--check", "worker.WorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - gsp-net

networks:
  gsp-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
